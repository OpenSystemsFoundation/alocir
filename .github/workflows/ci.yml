name: CI

on:
  push:
    branches: [main, swift-rewrite]
  pull_request:
    # swift-rewrite is the integration branch for the Swift app; its
    # workstream pull requests are checked here too.
    branches: [main, swift-rewrite]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, Linux-only checks. Runs alongside the platform builds below.
  lint:
    name: Format and clippy
    # Manual runs exist only for the app-store job below.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --target ${{ matrix.target }}

      - name: Create macOS app bundle
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          chmod +x scripts/build-macos.sh
          # Build a universal binary so the app runs natively on both Apple
          # Silicon and Intel Macs.
          if [[ "$IS_RELEASE" == "true" && -n "$MACOS_CERTIFICATE_P12" && -n "$APPLE_API_KEY_P8" ]]; then
            # Release builds: sign with the Developer ID certificate and
            # notarize, so Gatekeeper opens the app without warnings.
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD=$(uuidgen)
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"

            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"

            ./scripts/build-macos.sh --universal --sign "$MACOS_SIGN_IDENTITY" --notarize
          else
            # PRs and forks have no signing secrets: ad-hoc sign instead.
            ./scripts/build-macos.sh --universal
          fi
          # Package the .app on the macOS runner with ditto so the executable
          # bit, extended attributes, symlinks, code signature and stapled
          # notarization ticket are
          # preserved. upload-artifact strips the executable bit and re-zipping
          # the bundle on Linux invalidates the signature, which makes macOS
          # report the app as "damaged" (the Gatekeeper override can't fix a
          # broken signature). Uploading a ready-made zip avoids that round-trip.
          ditto -c -k --keepParent target/release/Alocir.app alocir-macos-universal.zip

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: alocir-linux-x86_64
          path: target/${{ matrix.target }}/release/alocir

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: alocir-windows-x86_64
          path: target/${{ matrix.target }}/release/alocir.exe

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: alocir-macos-universal
          path: alocir-macos-universal.zip

  # The native Swift app in swift/ (see docs/swift-rewrite.md). Needs the
  # macOS 27 SDK, which only the xcode-27 image has (a preview label; check
  # the actions/runner-images README if it stops being picked up).
  swift:
    name: Swift (macOS 27 SDK)
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      # For the Rust scanner that the Swift totals are checked against.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: xcode27-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: xcode27-cargo-

      - name: Build, test and check the Swift app
        run: ./swift/scripts/ci.sh

      # For the macos-26 job: the same universal build, run on the oldest
      # supported system. ditto keeps the bundle's symlinks and attributes.
      - name: Upload the built app
        run: ditto -c -k --keepParent swift/build/Build/Products/Release/Alocir.app "$RUNNER_TEMP/Alocir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: alocir-app-universal
          path: ${{ runner.temp }}/Alocir.zip

      # Each screen with demo data, light and dark, for reviewing the design.
      - name: Screenshots
        continue-on-error: true
        run: ./swift/scripts/screenshots.sh swift/build/Build/Products/Release/Alocir.app "$RUNNER_TEMP/screenshots"

      # Small JPEG copies in the log, for reviewers that can read the log
      # but not download artifacts. Decode a block with `base64 -d`.
      - name: Print screenshot previews
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for png in "$RUNNER_TEMP"/screenshots/*.png; do
            jpg="$RUNNER_TEMP/$(basename "$png" .png).jpg"
            sips -s format jpeg -s formatOptions 70 --resampleWidth 1280 "$png" --out "$jpg" >/dev/null
            echo "SCREENSHOT-BEGIN $(basename "$jpg")"
            base64 -b 0 -i "$jpg"; echo
            echo "SCREENSHOT-END"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn

  # The app's minimum is macOS 26, but it is built with the macOS 27 SDK. This
  # runs the build from the swift job on macOS 26, on Apple Silicon and on
  # Intel: the engine tests (built here with the image's own Xcode), then
  # every screenshot scene, which fails if the app doesn't launch or draw.
  macos-26:
    name: Swift on macOS 26 (${{ matrix.arch }})
    needs: swift
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: System
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Engine tests
        working-directory: swift
        run: swift test

      - uses: actions/download-artifact@v4
        with:
          name: alocir-app-universal
          path: ${{ runner.temp }}

      - name: Launch every screen
        run: |
          ditto -x -k "$RUNNER_TEMP/Alocir.zip" "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/Alocir.app"
          echo "Running the $(uname -m) slice of: $(lipo -archs "$app/Contents/MacOS/Alocir")"
          ./swift/scripts/screenshots.sh "$app" "$RUNNER_TEMP/screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos26-${{ matrix.arch }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn

  # Swift vs Rust scanner on the same runner: a synthetic tree and two real
  # ones from the image. Shared runners are noisy, so this reports medians
  # and is a comparison, not a measure of speed on a real Mac. The table is
  # posted on the pull request and in the job summary.
  benchmark:
    name: Benchmark (Swift vs Rust)
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: xcode27-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: xcode27-cargo-

      - name: Build the benchmark tree
        run: ./swift/scripts/make-bench-tree.sh "$RUNNER_TEMP/bench-tree"

      - name: Run the benchmark
        run: |
          ./swift/scripts/bench.sh --runs 5 --markdown \
            "$RUNNER_TEMP/bench-tree" /Applications/Xcode_27.2.app /usr > bench.md
          cat bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the results on the pull request
        if: always() && hashFiles('bench.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- alocir-benchmark -->'
          {
            echo "$marker"
            echo "### Scanner benchmark: Swift vs Rust (CI runner)"
            echo
            echo "Commit ${SHA:0:7}."
            cat bench.md
            echo
            echo "_Hosted runners are shared virtual machines: compare the two columns, not the absolute times. Real numbers come from \`swift/scripts/bench.sh\` on a Mac._"
          } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: version
        run: |
          # The workspace root has no version; the app crate holds it.
          VERSION=$(grep -m1 '^version' crates/alocir/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        run: |
          mkdir -p release

          # Linux
          cd artifacts/alocir-linux-x86_64
          chmod +x alocir
          zip ../../release/alocir-linux-x86_64.zip alocir
          cd ../..

          # Windows
          cd artifacts/alocir-windows-x86_64
          zip ../../release/alocir-windows-x86_64.zip alocir.exe
          cd ../..

          # macOS — the universal zip was already produced on the macOS runner
          # with ditto (preserving the executable bit, code signature and
          # notarization ticket), so use it as-is. Do NOT unpack and re-zip here:
          # repackaging the .app on Linux breaks the signature and macOS then
          # refuses to open the app.
          cp artifacts/alocir-macos-universal/alocir-macos-universal.zip release/alocir-macos-universal.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Alocir v${{ steps.version.outputs.version }}
          files: release/*
          make_latest: true
          generate_release_notes: true

  # Mac App Store build. Manual only: run it from the Actions tab
  # ("Run workflow"). Builds a universal, sandboxed .pkg signed for the store
  # and uploads it to App Store Connect. See docs/mac-app-store.md.
  app-store:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Check for App Store secrets
        id: secrets
        env:
          MAS_APP_CERT_P12: ${{ secrets.MAS_APP_CERT_P12 }}
          MAS_INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          MAS_APP_SIGN_IDENTITY: ${{ secrets.MAS_APP_SIGN_IDENTITY }}
          MAS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MAS_INSTALLER_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=""
          for name in MAS_APP_CERT_P12 MAS_INSTALLER_CERT_P12 MAS_CERT_PASSWORD \
            MAS_PROVISIONING_PROFILE MAS_APP_SIGN_IDENTITY MAS_INSTALLER_SIGN_IDENTITY \
            APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              missing="$missing $name"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::notice title=App Store build skipped::Missing secrets:$missing"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.available == 'true'

      - name: Install Rust toolchain
        if: steps.secrets.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Import signing certificates
        if: steps.secrets.outputs.available == 'true'
        env:
          MAS_APP_CERT_P12: ${{ secrets.MAS_APP_CERT_P12 }}
          MAS_INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MAS_APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MAS_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" \
            -P "$MAS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" \
            -P "$MAS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/embedded.provisionprofile"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and upload to App Store Connect
        if: steps.secrets.outputs.available == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          PROVISIONING_PROFILE: ${{ runner.temp }}/embedded.provisionprofile
          APP_SIGN_IDENTITY: ${{ secrets.MAS_APP_SIGN_IDENTITY }}
          INSTALLER_SIGN_IDENTITY: ${{ secrets.MAS_INSTALLER_SIGN_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh --universal --app-store --upload

      - name: Upload artifact (App Store pkg)
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alocir-mac-app-store
          path: target/release/Alocir.pkg
