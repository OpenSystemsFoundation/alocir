[package]
name = "alocir"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "alocir"
path = "src/main.rs"

[dependencies]
alocir-shared = { path = "../shared" }
eframe = "0.31"
rfd = "0.15"
trash = "5"
rayon = "1"
notify = "8"

[features]
# Mac App Store build (App Sandbox). Default builds are unaffected.
app-store = ["alocir-shared/app-store"]
