[package]
name = "alocir-shared"
version = "1.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
rfd = "0.15"
trash = "5"
rayon = "1"
notify = "8"

[features]
# Mac App Store build: hides features that cannot work inside the App Sandbox.
app-store = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false
